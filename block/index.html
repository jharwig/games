<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Block</title>
<meta name="theme-color" content="#0a0a10">
<script>
// the shared manifest/icons live at the site root; add the links at runtime
// so Vite does not rebase them into per-app hashed copies
[
  ["manifest", "../manifest.webmanifest", null],
  ["icon", "../icons/icon.svg", "image/svg+xml"],
  ["icon", "../icons/icon-192.png", "image/png"],
  ["apple-touch-icon", "../icons/apple-touch-icon.png", null]
].forEach(function (l) {
  var el = document.createElement("link");
  el.rel = l[0];
  el.href = l[1];
  if (l[2]) el.type = l[2];
  document.head.appendChild(el);
});
</script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #0a0a10;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    display: block;
    box-shadow: 0 0 0 2px #1d1d2a, 0 12px 40px rgba(0,0,0,0.8);
  }
  #pauseBtn {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 10px);
    right: calc(env(safe-area-inset-right, 0px) + 10px);
    width: 38px;
    height: 38px;
    padding: 0;
    display: none;
    align-items: center;
    justify-content: center;
    gap: 5px;
    background: rgba(10,10,16,0.72);
    border: 2px solid #1d1d2a;
    border-radius: 6px;
    cursor: pointer;
    z-index: 10;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  #pauseBtn.visible { display: flex; }
  #pauseBtn:active { background: rgba(29,29,42,0.92); }
  #pauseBtn .bar {
    width: 5px;
    height: 16px;
    background: #ffffff;
    border-radius: 1px;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<button id="pauseBtn" type="button" aria-label="Pause"><span class="bar"></span><span class="bar"></span></button>
<!-- iOS haptic hack: a programmatic toggle of a switch-style checkbox makes a haptic tap on iOS 17.4+ -->
<label id="haptic" style="position:fixed;left:-9999px;top:0" aria-hidden="true"><input type="checkbox" switch tabindex="-1"></label>
<script type="module" src="./src/main.ts"></script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("../sw.js");
  });
}
</script>
</body>
</html>
