<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Games</title>
<meta name="theme-color" content="#0a0a10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root {
    --bg: #0a0a10;
    --card: #12121c;
    --border: #1d1d2a;
    --text: #e8e8f0;
    --muted: #8a8aa0;
    --accent: #ff8f2b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Courier New", ui-monospace, Menlo, Consolas, monospace;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px 48px;
  }
  h1 {
    font-size: 28px;
    letter-spacing: 6px;
    text-transform: uppercase;
    margin: 16px 0 4px;
    text-shadow: 0 3px 0 #000;
  }
  .tagline {
    color: var(--muted);
    font-size: 13px;
    margin: 0 0 32px;
  }
  .games {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 280px));
    gap: 20px;
    justify-content: center;
    width: 100%;
    max-width: 900px;
  }
  .game-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 24px 20px 20px;
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 8px;
    text-decoration: none;
    color: var(--text);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.8);
    transition: transform 0.12s ease, border-color 0.12s ease;
  }
  .game-card:hover,
  .game-card:focus-visible {
    transform: translateY(-3px);
    border-color: var(--accent);
    outline: none;
  }
  .game-icon {
    width: 96px;
    height: 96px;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  .game-title {
    font-size: 20px;
    letter-spacing: 4px;
    text-transform: uppercase;
  }
  .game-designer {
    color: var(--muted);
    font-size: 12px;
  }
  .game-designer b {
    color: var(--accent);
    font-weight: normal;
  }
  .play {
    margin-top: 4px;
    font-size: 12px;
    letter-spacing: 2px;
    color: var(--accent);
  }
</style>
</head>
<body>
  <h1>Games</h1>
  <p class="tagline">small browser games — tap a card to play</p>

  <div class="games">
    <a class="game-card" href="block/">
      <!-- pixel-art icon: the orange hero flying through a gap in a block tower -->
      <svg class="game-icon" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true">
        <rect width="16" height="16" fill="#0e0e18"/>
        <!-- stars -->
        <rect x="2" y="1" width="1" height="1" fill="#5a5a78"/>
        <rect x="6" y="3" width="1" height="1" fill="#5a5a78"/>
        <rect x="1" y="6" width="1" height="1" fill="#42425e"/>
        <rect x="4" y="10" width="1" height="1" fill="#42425e"/>
        <!-- moon -->
        <rect x="1" y="2" width="3" height="3" fill="#d8d8c8"/>
        <rect x="2" y="3" width="1" height="1" fill="#b0b0a0"/>
        <!-- block tower with a gap -->
        <rect x="11" y="0" width="4" height="5" fill="#3a4a6a"/>
        <rect x="11" y="0" width="4" height="1" fill="#4e6088"/>
        <rect x="12" y="2" width="1" height="1" fill="#ffd447"/>
        <rect x="11" y="9" width="4" height="7" fill="#3a4a6a"/>
        <rect x="11" y="9" width="4" height="1" fill="#4e6088"/>
        <rect x="13" y="11" width="1" height="1" fill="#ffd447"/>
        <rect x="12" y="13" width="1" height="1" fill="#ffd447"/>
        <!-- ground -->
        <rect x="0" y="15" width="11" height="1" fill="#1d1d2a"/>
        <!-- orange hero in the gap -->
        <rect x="6" y="6" width="4" height="4" fill="#ff8f2b"/>
        <rect x="6" y="6" width="4" height="1" fill="#ffb45e"/>
        <rect x="8" y="7" width="1" height="1" fill="#0a0a10"/>
        <rect x="5" y="8" width="1" height="1" fill="#c95f12"/>
      </svg>
      <span class="game-title">Block</span>
      <span class="game-designer">Designed by <b>Arthur</b></span>
      <span class="play">▶ Play</span>
    </a>

    <a class="game-card" href="sail/">
      <!-- pixel-art icon: a sailboat racing on open water -->
      <svg class="game-icon" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true">
        <rect width="16" height="16" fill="#06283d"/>
        <!-- sky -->
        <rect x="0" y="0" width="16" height="10" fill="#0d3f5e"/>
        <!-- sun -->
        <rect x="12" y="1" width="3" height="3" fill="#ffd12e"/>
        <rect x="13" y="2" width="1" height="1" fill="#ffe98c"/>
        <!-- clouds -->
        <rect x="1" y="2" width="4" height="1" fill="#9fc4d8"/>
        <rect x="2" y="3" width="2" height="1" fill="#7ea9c0"/>
        <!-- mainsail -->
        <rect x="8" y="2" width="1" height="8" fill="#eef6fb"/>
        <rect x="9" y="3" width="1" height="7" fill="#eef6fb"/>
        <rect x="10" y="5" width="1" height="5" fill="#dce9f2"/>
        <rect x="11" y="7" width="1" height="3" fill="#dce9f2"/>
        <!-- jib -->
        <rect x="6" y="4" width="1" height="6" fill="#ff5c39"/>
        <rect x="5" y="6" width="1" height="4" fill="#ff5c39"/>
        <!-- mast -->
        <rect x="7" y="1" width="1" height="10" fill="#8a5a33"/>
        <!-- hull -->
        <rect x="3" y="11" width="11" height="2" fill="#ffd12e"/>
        <rect x="4" y="12" width="9" height="1" fill="#d9a900"/>
        <!-- water -->
        <rect x="0" y="13" width="16" height="3" fill="#0a4a6e"/>
        <rect x="0" y="13" width="3" height="1" fill="#2e7ea6"/>
        <rect x="12" y="14" width="4" height="1" fill="#2e7ea6"/>
        <rect x="6" y="15" width="4" height="1" fill="#2e7ea6"/>
      </svg>
      <span class="game-title">Regatta</span>
      <span class="game-designer">offshore arcade sailing</span>
      <span class="play">▶ Play</span>
    </a>

    <a class="game-card" href="ninja/">
      <!-- pixel-art icon: a ninja flipping over the medal podium past colorful bars -->
      <svg class="game-icon" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true">
        <rect width="16" height="16" fill="#56c8f5"/>
        <!-- sun -->
        <rect x="13" y="1" width="3" height="3" fill="#ffe14d"/>
        <rect x="14" y="2" width="1" height="1" fill="#fff6b0"/>
        <!-- clouds -->
        <rect x="1" y="1" width="4" height="1" fill="#ffffff"/>
        <rect x="2" y="2" width="2" height="1" fill="#dceaf5"/>
        <!-- rope -->
        <rect x="6" y="0" width="1" height="5" fill="#c98f3c"/>
        <!-- monkey bar rig -->
        <rect x="0" y="5" width="6" height="1" fill="#ff2e5b"/>
        <rect x="1" y="6" width="1" height="1" fill="#ffb02e"/>
        <rect x="3" y="6" width="1" height="1" fill="#2ee6a8"/>
        <rect x="5" y="6" width="1" height="1" fill="#8f5cff"/>
        <rect x="0" y="6" width="1" height="8" fill="#e0224a"/>
        <!-- ninja mid-flip -->
        <rect x="9" y="7" width="2" height="1" fill="#f6cfa8"/>
        <rect x="8" y="7" width="1" height="1" fill="#ff2e5b"/>
        <rect x="9" y="8" width="2" height="2" fill="#2b2b3d"/>
        <rect x="11" y="8" width="1" height="1" fill="#f6cfa8"/>
        <rect x="8" y="9" width="1" height="1" fill="#f6cfa8"/>
        <rect x="9" y="9" width="2" height="1" fill="#ff2e5b"/>
        <!-- podium: silver, gold, bronze -->
        <rect x="7" y="12" width="3" height="2" fill="#cfd6e0"/>
        <rect x="7" y="12" width="3" height="1" fill="#eef2f7"/>
        <rect x="10" y="11" width="3" height="3" fill="#ffd24d"/>
        <rect x="10" y="11" width="3" height="1" fill="#ffe89a"/>
        <rect x="13" y="13" width="3" height="1" fill="#d1793a"/>
        <!-- ground -->
        <rect x="0" y="14" width="16" height="2" fill="#3fae4a"/>
        <rect x="0" y="15" width="16" height="1" fill="#2c8438"/>
      </svg>
      <span class="game-title">Ninja Adventure</span>
      <span class="game-designer">Designed by <b>Gemma</b></span>
      <span class="play">▶ Play</span>
    </a>
  </div>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js");
  });
}
</script>
</body>
</html>
