<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Games</title>
<meta name="theme-color" content="#0a0a10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root {
    --bg: #0a0a10;
    --card: #12121c;
    --border: #1d1d2a;
    --text: #e8e8f0;
    --muted: #8a8aa0;
    --accent: #ff8f2b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Courier New", ui-monospace, Menlo, Consolas, monospace;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px 48px;
  }
  h1 {
    font-size: 28px;
    letter-spacing: 6px;
    text-transform: uppercase;
    margin: 16px 0 4px;
    text-shadow: 0 3px 0 #000;
  }
  .tagline {
    color: var(--muted);
    font-size: 13px;
    margin: 0 0 32px;
  }
  .games {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 280px));
    gap: 20px;
    justify-content: center;
    width: 100%;
    max-width: 900px;
  }
  .game-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 24px 20px 20px;
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 8px;
    text-decoration: none;
    color: var(--text);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.8);
    transition: transform 0.12s ease, border-color 0.12s ease;
  }
  .game-card:hover,
  .game-card:focus-visible {
    transform: translateY(-3px);
    border-color: var(--accent);
    outline: none;
  }
  .game-icon {
    width: 96px;
    height: 96px;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  .game-title {
    font-size: 20px;
    letter-spacing: 4px;
    text-transform: uppercase;
  }
  .game-designer {
    color: var(--muted);
    font-size: 12px;
  }
  .game-designer b {
    color: var(--accent);
    font-weight: normal;
  }
  .play {
    margin-top: 4px;
    font-size: 12px;
    letter-spacing: 2px;
    color: var(--accent);
  }
</style>
</head>
<body>
  <h1>Games</h1>
  <p class="tagline">small browser games — tap a card to play</p>

  <div class="games">
    <a class="game-card" href="block/">
      <!-- pixel-art icon: the orange hero flying through a gap in a block tower -->
      <svg class="game-icon" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true">
        <rect width="16" height="16" fill="#0e0e18"/>
        <!-- stars -->
        <rect x="2" y="1" width="1" height="1" fill="#5a5a78"/>
        <rect x="6" y="3" width="1" height="1" fill="#5a5a78"/>
        <rect x="1" y="6" width="1" height="1" fill="#42425e"/>
        <rect x="4" y="10" width="1" height="1" fill="#42425e"/>
        <!-- moon -->
        <rect x="1" y="2" width="3" height="3" fill="#d8d8c8"/>
        <rect x="2" y="3" width="1" height="1" fill="#b0b0a0"/>
        <!-- block tower with a gap -->
        <rect x="11" y="0" width="4" height="5" fill="#3a4a6a"/>
        <rect x="11" y="0" width="4" height="1" fill="#4e6088"/>
        <rect x="12" y="2" width="1" height="1" fill="#ffd447"/>
        <rect x="11" y="9" width="4" height="7" fill="#3a4a6a"/>
        <rect x="11" y="9" width="4" height="1" fill="#4e6088"/>
        <rect x="13" y="11" width="1" height="1" fill="#ffd447"/>
        <rect x="12" y="13" width="1" height="1" fill="#ffd447"/>
        <!-- ground -->
        <rect x="0" y="15" width="11" height="1" fill="#1d1d2a"/>
        <!-- orange hero in the gap -->
        <rect x="6" y="6" width="4" height="4" fill="#ff8f2b"/>
        <rect x="6" y="6" width="4" height="1" fill="#ffb45e"/>
        <rect x="8" y="7" width="1" height="1" fill="#0a0a10"/>
        <rect x="5" y="8" width="1" height="1" fill="#c95f12"/>
      </svg>
      <span class="game-title">Block</span>
      <span class="game-designer">Designed by <b>Arthur</b></span>
      <span class="play">▶ Play</span>
    </a>
  </div>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js");
  });
}
</script>
</body>
</html>
