<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Bee Draw</title>
<meta name="theme-color" content="#0a0a10">
<script>
// the shared manifest/icons live at the site root; add the links at runtime
// so Vite does not rebase them into per-app hashed copies
[
  ["manifest", "../manifest.webmanifest", null],
  ["icon", "../icons/icon.svg", "image/svg+xml"],
  ["icon", "../icons/icon-192.png", "image/png"],
  ["apple-touch-icon", "../icons/apple-touch-icon.png", null]
].forEach(function (l) {
  var el = document.createElement("link");
  el.rel = l[0];
  el.href = l[1];
  if (l[2]) el.type = l[2];
  document.head.appendChild(el);
});
</script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    box-sizing: border-box;
    background: #0a0a10;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Courier New", monospace;
    /* keep the canvas clear of the notch and the home bar */
    padding:
      env(safe-area-inset-top, 0px)
      env(safe-area-inset-right, 0px)
      env(safe-area-inset-bottom, 0px)
      env(safe-area-inset-left, 0px);
  }
  canvas {
    display: block;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    box-shadow: 0 0 0 2px #1d1d2a, 0 12px 40px rgba(0,0,0,0.8);
    border-radius: 4px;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
