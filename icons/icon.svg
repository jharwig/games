<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" shape-rendering="crispEdges">
  <!-- night-sky background -->
  <rect x="0" y="0" width="24" height="24" rx="4" fill="#0f1120"/>

  <!-- stars -->
  <rect x="14" y="3" width="1" height="1" fill="#cfd6ff"/>
  <rect x="19" y="5" width="1" height="1" fill="#8f99cc"/>
  <rect x="17" y="8" width="1" height="1" fill="#cfd6ff"/>
  <rect x="3" y="2" width="1" height="1" fill="#8f99cc"/>

  <!-- pine tree -->
  <rect x="6" y="3" width="1" height="1" fill="#2e9e57"/>
  <rect x="5" y="4" width="3" height="1" fill="#2e9e57"/>
  <rect x="4" y="5" width="5" height="1" fill="#27874b"/>
  <rect x="5" y="6" width="3" height="1" fill="#2e9e57"/>
  <rect x="4" y="7" width="5" height="1" fill="#2e9e57"/>
  <rect x="3" y="8" width="7" height="1" fill="#27874b"/>
  <rect x="4" y="9" width="5" height="1" fill="#2e9e57"/>
  <rect x="3" y="10" width="7" height="1" fill="#2e9e57"/>
  <rect x="2" y="11" width="9" height="1" fill="#27874b"/>
  <!-- trunk -->
  <rect x="5" y="12" width="3" height="5" fill="#6b4226"/>
  <rect x="5" y="12" width="1" height="5" fill="#59371f"/>

  <!-- game controller body -->
  <rect x="10" y="12" width="12" height="8" fill="#3a3f52"/>
  <rect x="9" y="13" width="1" height="6" fill="#3a3f52"/>
  <rect x="22" y="13" width="1" height="6" fill="#3a3f52"/>
  <rect x="10" y="12" width="12" height="1" fill="#4a5068"/>

  <!-- d-pad -->
  <rect x="12" y="13" width="1" height="4" fill="#14161f"/>
  <rect x="11" y="14" width="3" height="2" fill="#14161f"/>

  <!-- buttons -->
  <rect x="17" y="13" width="2" height="2" fill="#ffb347"/>
  <rect x="19" y="15" width="2" height="2" fill="#ff7a2f"/>

  <!-- start/select -->
  <rect x="15" y="18" width="1" height="1" fill="#14161f"/>
  <rect x="17" y="18" width="1" height="1" fill="#14161f"/>
</svg>
