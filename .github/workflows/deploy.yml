name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Generate root index of games
        run: |
          {
            echo '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">'
            echo '<meta name="viewport" content="width=device-width, initial-scale=1">'
            echo '<title>Games</title>'
            echo '<meta name="theme-color" content="#0a0a10">'
            echo '<link rel="manifest" href="manifest.webmanifest">'
            echo '<link rel="icon" href="icons/icon.svg" type="image/svg+xml">'
            echo '<link rel="icon" href="icons/icon-192.png" type="image/png">'
            echo '<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">'
            echo '<style>body{background:#0a0a10;color:#eee;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:3rem 1rem}a{color:#8cf;font-size:1.4rem;margin:.4rem;text-decoration:none}a:hover{text-decoration:underline}</style>'
            echo '</head><body><h1>Games</h1>'
            for d in */; do
              name="${d%/}"
              if [ -f "$d/index.html" ]; then
                echo "<a href=\"$name/\">$name</a>"
              fi
            done
            echo '<script>if ("serviceWorker" in navigator) { window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js"); }); }</script>'
            echo '</body></html>'
          } > index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
