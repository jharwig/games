<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Slam Trunk — style preview</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    body { font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif; color: #fff; user-select: none; -webkit-user-select: none; }
    #app { position: fixed; inset: 0; touch-action: none; }
    canvas { display: block; }
    #bar {
      position: fixed; left: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 8px;
      background: rgba(0,0,0,.6); padding: 10px 12px; border-radius: 12px; backdrop-filter: blur(6px);
      font-size: 12px; max-width: calc(100% - 24px);
    }
    #bar.hidden { display: none; }
    .grp { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .grp span { width: 62px; opacity: .6; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; font-size: 10px; }
    button {
      font: inherit; font-weight: 800; color: #fff; background: rgba(255,255,255,.12); border: 2px solid transparent;
      border-radius: 999px; padding: 5px 12px; cursor: pointer;
    }
    button.on { border-color: #ffd12e; color: #ffd12e; }
    #hud { position: fixed; top: 14px; left: 0; right: 0; display: flex; justify-content: center; gap: 14px; pointer-events: none; }
    .pill { background: rgba(0,0,0,.55); border-radius: 14px; padding: 6px 16px; text-align: center; font-weight: 800; }
    .pill small { display: block; font-size: 11px; opacity: .8; letter-spacing: 1px; }
    .pill b { font-size: 26px; }
    .pill.timer b { color: #ffd12e; }
    .pill.p { border-left: 8px solid #9e9e9e; } .pill.e { border-left: 8px solid #1a3a8f; }
    #coins { position: fixed; top: 14px; right: 14px; background: rgba(0,0,0,.55); border-radius: 20px; padding: 8px 16px; font-weight: 800; font-size: 20px; pointer-events: none; }
    #tag { position: fixed; top: 14px; left: 14px; background: rgba(0,0,0,.55); border-radius: 16px; padding: 8px 14px; font-weight: 800; font-size: 14px; pointer-events: none; }
    #hint { position: fixed; right: 12px; bottom: 10px; font-size: 11px; opacity: .55; }
    #tip { position: fixed; left: 50%; bottom: 22%; transform: translateX(-50%); font-weight: 800; font-size: 18px; text-shadow: 0 2px 6px #000; pointer-events: none; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="hud">
    <div class="pill p"><small>PEANUT</small><b>6</b></div>
    <div class="pill timer"><small>TIME</small><b>0:42</b></div>
    <div class="pill e"><small>ELLIE</small><b>4</b></div>
  </div>
  <div id="tag">🎪 Circus Tent</div>
  <div id="coins">🪙 x 3</div>
  <div id="tip">drag to aim · let go to shoot</div>
  <div id="bar"></div>
  <div id="hint">H: hide panel for a clean screenshot</div>
  <script type="module" src="/src/mockup.ts"></script>
</body>
</html>
